name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LyricFlow-Android-Source-Ready.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          unzip -o LyricFlow-Android-Source-Ready.zip
          test -f LyricFlow/app/build.gradle.kts
      - name: Build debug APK
        working-directory: LyricFlow
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LyricsFlow-APK
          path: LyricFlow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
