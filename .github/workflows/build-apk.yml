name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LyricsFlow-Source.zip'
      - 'Lyrical-Coffee-Overrides.part*'
      - 'Lyrical-Hotfix.part*'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android source and Lyrical updates
        run: |
          unzip -o LyricsFlow-Source.zip
          cat Lyrical-Coffee-Overrides.part* > Lyrical-Coffee-Overrides.tar.xz
          tar -xJf Lyrical-Coffee-Overrides.tar.xz
          cat Lyrical-Hotfix.part* > Lyrical-Hotfix.tar.xz
          tar -xJf Lyrical-Hotfix.tar.xz
          test -f LyricFlow/app/build.gradle.kts
      - name: Verify Lyrical source updates
        run: |
          grep -q 'COFFEE("Coffee")' LyricFlow/app/src/main/java/com/lyricflow/data/Model.kt
          grep -q 'WidgetPreviewCard' LyricFlow/app/src/main/java/com/lyricflow/ui/Screens.kt
          grep -q 'delay(500L)' LyricFlow/app/src/main/java/com/lyricflow/playback/LyricListenerService.kt
          grep -q 'AnimStyle.TYPEWRITER' LyricFlow/app/src/main/java/com/lyricflow/widget/LyricWidget.kt
          grep -q '<string name="app_name">Lyrical</string>' LyricFlow/app/src/main/res/values/strings.xml
      - name: Run unit tests and build debug APK
        working-directory: LyricFlow
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Lyrical-APK
          path: LyricFlow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
