name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LyricsFlow-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          unzip -o LyricsFlow-Source.zip
          test -f LyricFlow/app/build.gradle.kts
      - name: Apply Kotlin compatibility fixes
        working-directory: LyricFlow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/lyricflow/ui/LyricsView.kt")
          s = p.read_text()
          s = s.replace("import androidx.compose.foundation.layout.matchParentSize", "import androidx.compose.foundation.layout.fillMaxSize")
          s = s.replace("Modifier.matchParentSize()", "Modifier.fillMaxSize()")
          p.write_text(s)

          p = Path("app/src/main/java/com/lyricflow/widget/LyricWidget.kt")
          s = p.read_text()
          s = s.replace("import android.content.Context", "import android.content.Context\nimport android.content.Intent")
          s = s.replace("WidgetBody(s, np, bg, listening)", "WidgetBody(s, np, bg, listening, context)")
          s = s.replace("private fun WidgetBody(s: LyricSettings, np: NowPlaying, bg: Bitmap?, listening: Boolean)", "private fun WidgetBody(s: LyricSettings, np: NowPlaying, bg: Bitmap?, listening: Boolean, context: Context)")
          s = s.replace("actionStartActivity<MainActivity>()", "actionStartActivity(Intent(context, MainActivity::class.java))")
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: LyricFlow
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LyricsFlow-APK
          path: LyricFlow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
